name: CI

on:
  push:
    branches: [main, "vibe/**", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build & test Android app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (necessario per Robolectric SDK 36)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Python 3 (per codegen SeedData.kt)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper (solo se non è committato nel repo)
        run: |
          if [ ! -x ./gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi

      - name: Controllo event-data.json (IBAN segnaposto = avviso)
        run: python3 tools/check-event-data.py

      - name: Codegen check (SeedData.kt sincronizzato col JSON)
        run: |
          python3 tools/gen-event-data.py
          if ! git diff --exit-code -- app/src/main/java/com/example/data/SeedData.kt; then
            echo "::error::SeedData.kt non è sincronizzato con pwa/shared/event-data.json. Esegui 'python3 tools/gen-event-data.py' e committa."
            exit 1
          fi

      - name: Provision debug keystore (non committato, gitignored)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble debug APK (valida codegen + compilazione)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuroParty-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  pwa:
    name: Test PWA (sintassi + end-to-end con backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout backend (repo neuroparty-backend, oppure branch "backend" di questo repo)
        run: |
          git clone --depth 1 https://github.com/fedele93/neuroparty-backend.git backend \
            || git clone --depth 1 --branch backend --single-branch "https://github.com/${GITHUB_REPOSITORY}.git" backend
          ls backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Controllo sintassi JS e JSON
        run: |
          for f in pwa/js/*.js pwa/sw.js pwa/tests/*.mjs; do node --check "$f"; done
          python3 -c "import json; json.load(open('pwa/shared/event-data.json')); json.load(open('pwa/manifest.webmanifest'))"

      - name: Fixture snapshot.json dei test Android allineato al backend
        run: |
          pip install -r backend/requirements-dev.txt
          python3 tools/gen-snapshot-fixture.py --backend backend --check

      - name: Avvia backend locale
        run: |
          pip install -r backend/requirements.txt
          cd backend
          DATA_DIR=/tmp/npdata SEED_DEMO_DATA=true ADMIN_TOKEN=ci-token PWA_DIR="$GITHUB_WORKSPACE/pwa" \
            nohup uvicorn app.main:app --host 127.0.0.1 --port 8765 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/api/health && break; sleep 1; done

      - name: Installa Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright@1
          npx playwright install --with-deps chromium

      - name: Test end-to-end
        env:
          BASE_URL: http://127.0.0.1:8765
          ADMIN_TOKEN: ci-token
          SCREENSHOT_DIR: pwa-screenshots
        run: node pwa/tests/e2e.mjs

      - name: Log backend (in caso di errore)
        if: failure()
        run: cat /tmp/backend.log

      - name: Upload screenshot PWA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-screenshots
          path: pwa-screenshots/
