name: CI

on:
  push:
    branches: [main, "vibe/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & test Android app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python 3 (per codegen SeedData.kt)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Codegen check (SeedData.kt sincronizzato col JSON)
        run: |
          python3 tools/gen-event-data.py
          if ! git diff --exit-code -- app/src/main/java/com/example/data/SeedData.kt; then
            echo "::error::SeedData.kt non è sincronizzato con pwa/shared/event-data.json. Esegui 'python3 tools/gen-event-data.py' e committa."
            exit 1
          fi

      - name: Provision debug keystore (non committato, gitignored)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble debug APK (valida codegen + compilazione)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
